[project]
name = "soulprint-api"
version = "0.1.0"
description = "SoulPrint Azure Functions demo API"
requires-python = ">=3.12"
dependencies = [
  "azure-functions>=1.21.3",
  "httpx>=0.28.1",
  "python-dotenv>=1.1.1"
]

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
